<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
<title id="title">Inference + invalid windows</title><desc id="desc">Live or recorded CSI enters a ring buffer and validity gate. Valid windows use per-link L2 and stored normalization, then the checkpoint-loaded WiSPPN model, presence gating, smoothing and experimental fall rules. Invalid windows increment the drop count and retain the previous displayed pose and state.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#1558d6"/></marker></defs>
<rect width="1000" height="680" fill="#ffffff" stroke="#c9cfd6"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="24" y="35" font-size="23" font-weight="700" fill="#20252b">Inference + invalid windows</text>
<rect x="40" y="80" width="250" height="90" rx="4" fill="#ffffff" stroke="#abb3bf"/>
<text x="54" y="108" font-size="17" font-weight="700" fill="#20252b">Live or recorded CSI</text>
<text x="54" y="132" font-size="15" font-weight="400" fill="#58616c">Incoming link packets</text>
<rect x="375" y="80" width="250" height="90" rx="4" fill="#ffffff" stroke="#abb3bf"/>
<text x="389" y="108" font-size="17" font-weight="700" fill="#20252b">Ring buffer</text>
<text x="389" y="132" font-size="15" font-weight="400" fill="#58616c">Build window + validity</text>
<rect x="710" y="80" width="250" height="90" rx="4" fill="#eef4ff" stroke="#1558d6"/>
<text x="724" y="108" font-size="17" font-weight="700" fill="#20252b">Valid window?</text>
<text x="724" y="132" font-size="15" font-weight="400" fill="#58616c">Missing-data gate</text>
<rect x="40" y="240" width="250" height="90" rx="4" fill="#ffffff" stroke="#abb3bf"/>
<text x="54" y="268" font-size="17" font-weight="700" fill="#20252b">Trained checkpoint</text>
<text x="54" y="292" font-size="15" font-weight="400" fill="#58616c">Weights + saved statistics</text>
<rect x="375" y="240" width="250" height="90" rx="4" fill="#ffffff" stroke="#abb3bf"/>
<text x="389" y="268" font-size="17" font-weight="700" fill="#20252b">Normalize</text>
<text x="389" y="292" font-size="15" font-weight="400" fill="#58616c">Per-link L2 + stored scale</text>
<rect x="710" y="240" width="250" height="90" rx="4" fill="#ffffff" stroke="#abb3bf"/>
<text x="724" y="268" font-size="17" font-weight="700" fill="#20252b">WiSPPN model</text>
<text x="724" y="292" font-size="15" font-weight="400" fill="#58616c">Extract 18 joints</text>
<rect x="710" y="400" width="250" height="90" rx="4" fill="#ffffff" stroke="#abb3bf"/>
<text x="724" y="428" font-size="17" font-weight="700" fill="#20252b">Presence + smoothing</text>
<text x="724" y="452" font-size="15" font-weight="400" fill="#58616c">Gate and stabilize pose</text>
<rect x="375" y="400" width="250" height="90" rx="4" fill="#ffffff" stroke="#abb3bf"/>
<text x="389" y="428" font-size="17" font-weight="700" fill="#20252b">Experimental fall rules</text>
<text x="389" y="452" font-size="15" font-weight="400" fill="#58616c">Update rule-based state</text>
<rect x="40" y="400" width="250" height="90" rx="4" fill="#ffffff" stroke="#abb3bf"/>
<text x="54" y="428" font-size="17" font-weight="700" fill="#20252b">Render pose + state</text>
<text x="54" y="452" font-size="15" font-weight="400" fill="#58616c">Current or retained estimate</text>
<rect x="710" y="560" width="250" height="90" rx="4" fill="#ffffff" stroke="#abb3bf"/>
<text x="724" y="588" font-size="17" font-weight="700" fill="#20252b">Hold previous display</text>
<text x="724" y="612" font-size="15" font-weight="400" fill="#58616c">Count drop; retain pose/state</text>
<path d="M292 125 H373" fill="none" stroke="#1558d6" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M627 125 H708" fill="none" stroke="#1558d6" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M292 285 H373" fill="none" stroke="#1558d6" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M627 285 H708" fill="none" stroke="#1558d6" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M835 172 V208 H500 V238" fill="none" stroke="#1558d6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="848" y="202" font-size="14" font-weight="700" fill="#1558d6">yes</text>
<path d="M835 332 V398" fill="none" stroke="#1558d6" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M708 445 H627" fill="none" stroke="#1558d6" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M373 445 H292" fill="none" stroke="#1558d6" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M962 125 H980 V605 H962" fill="none" stroke="#1558d6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="956" y="206" font-size="14" font-weight="700" fill="#1558d6">no</text>
<path d="M708 605 H165 V492" fill="none" stroke="#1558d6" stroke-width="2" marker-end="url(#arrow)"/>
</g></svg>
