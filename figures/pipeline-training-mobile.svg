<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 760" role="img" aria-labelledby="title desc">
<title id="title">Training → checkpoint</title><desc id="desc">Synchronized camera video passes through RTMDet and RTMPose to produce 18-joint labels. Recorded CSI becomes aligned windows. Timestamp joining, label QA and presence targets produce pairs for normalization and pose-regression training, which saves weights, configuration and statistics in a checkpoint.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#1558d6"/></marker></defs>
<rect width="420" height="760" fill="#ffffff" stroke="#c9cfd6"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="24" y="35" font-size="23" font-weight="700" fill="#20252b">Training → checkpoint</text>
<rect x="24" y="64" width="372" height="76" rx="4" fill="#ffffff" stroke="#abb3bf"/>
<text x="38" y="92" font-size="19" font-weight="700" fill="#20252b">Synchronized camera video</text>
<text x="38" y="116" font-size="15" font-weight="400" fill="#58616c">Training-label source</text>
<rect x="24" y="172" width="372" height="76" rx="4" fill="#ffffff" stroke="#abb3bf"/>
<text x="38" y="200" font-size="19" font-weight="700" fill="#20252b">RTMDet → RTMPose teacher</text>
<text x="38" y="224" font-size="15" font-weight="400" fill="#58616c">Detect person; label pose</text>
<path d="M210 142 V170" fill="none" stroke="#1558d6" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="280" width="176" height="76" rx="4" fill="#ffffff" stroke="#abb3bf"/>
<text x="38" y="308" font-size="17" font-weight="700" fill="#20252b">18-joint labels</text>
<text x="38" y="332" font-size="15" font-weight="400" fill="#58616c">Teacher output</text>
<rect x="220" y="280" width="176" height="76" rx="4" fill="#ffffff" stroke="#abb3bf"/>
<text x="234" y="308" font-size="17" font-weight="700" fill="#20252b">Recorded CSI</text>
<text x="234" y="332" font-size="15" font-weight="400" fill="#58616c">Aligned windows</text>
<path d="M210 250 V264 H112 V278" fill="none" stroke="#1558d6" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="400" width="372" height="76" rx="4" fill="#ffffff" stroke="#abb3bf"/>
<text x="38" y="428" font-size="19" font-weight="700" fill="#20252b">Join timestamps + label QA</text>
<text x="38" y="452" font-size="15" font-weight="400" fill="#58616c">Build presence targets</text>
<path d="M112 358 V382 H210 V398" fill="none" stroke="#1558d6" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M308 358 V382 H210" fill="none" stroke="#1558d6" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="512" width="372" height="76" rx="4" fill="#ffffff" stroke="#abb3bf"/>
<text x="38" y="540" font-size="18" font-weight="700" fill="#20252b">Fit normalization + pose model</text>
<text x="38" y="564" font-size="15" font-weight="400" fill="#58616c">Train on paired CSI and labels</text>
<path d="M210 478 V510" fill="none" stroke="#1558d6" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="624" width="372" height="86" rx="4" fill="#ffffff" stroke="#abb3bf"/>
<text x="38" y="652" font-size="19" font-weight="700" fill="#20252b">Saved checkpoint</text>
<text x="38" y="676" font-size="15" font-weight="400" fill="#58616c">Weights, configuration, statistics</text>
<path d="M210 590 V622" fill="none" stroke="#1558d6" stroke-width="2" marker-end="url(#arrow)"/>
</g></svg>
